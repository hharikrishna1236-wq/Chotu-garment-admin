/* ---- enquiries ---- */
async function enq(){var f=PS.es||"",r=await rows("enquiries?select=*&order=created_at.desc"+(f?"&status=eq."+encodeURIComponent(f):""),50,0);
V.innerHTML='<h1>Enquiries</h1><div class="row"><label for="ef" class="sr">Filter</label><select id="ef" style="width:auto"><option value="">All statuses</option>'+ST.map(function(s){return'<option'+(s==f?" selected":"")+'>'+s+'</option>'}).join("")+'</select><span class="mute">'+r.total+' total</span></div>'+(r.rows.length?r.rows.map(enqCard).join(""):'<p class="mute">No enquiries.</p>');
$("#ef").onchange=function(){PS.es=this.value;enq().catch(fail)}}
/* ---- settings ---- */
async function sett(){var s=(await rows("company_settings?select=*&id=eq.1")).rows[0]||{},v=function(x){return esc(x)},f=function(i,l,k,h){return'<label for="'+i+'">'+l+'</label><input id="'+i+'" value="'+v(s[k])+'" placeholder="'+(h||"")+'">'};
V.innerHTML='<h1>Business details</h1><form id="sf" class="card" novalidate><div id="se" class="err" role="alert" hidden></div>'+f("sp","Phone (with +91)","phone","+917080698250")+f("sw","WhatsApp number (digits only, with 91)","whatsapp","917080698250")+f("sm","Email","email")+f("sa","Address","address")+f("sh","Business hours","business_hours","Saturday & Sunday")+f("sg","Google Maps link (https://…)","maps_url")+'<p><button class="btn" id="ss">Save details</button></p></form>';
$("#sf").onsubmit=async function(e){e.preventDefault();var g=function(i){return $("#"+i).value.trim()||null},d={phone:g("sp"),whatsapp:g("sw"),email:g("sm"),address:g("sa"),business_hours:g("sh"),maps_url:g("sg")},er=[];
if(d.phone&&!/^\+\d{11,15}$/.test(d.phone))er.push("Phone must look like +917080698250.");if(d.whatsapp&&!/^\d{11,15}$/.test(d.whatsapp))er.push("WhatsApp must be 11 to 15 digits, no + or spaces.");if(d.maps_url&&!/^https:\/\//.test(d.maps_url))er.push("Maps link must start with https://");
var b=$("#se");b.hidden=!er.length;b.innerHTML=er.join("<br>");if(er.length)return;var bt=$("#ss");bt.disabled=true;
try{d.updated_at=new Date().toISOString();await write("PATCH","company_settings?id=eq.1",d);toast("Details saved. The website will show them.")}catch(x){fail(x)}bt.disabled=false}}
/* ---- events ---- */
document.addEventListener("click",async function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,d=b.dataset;
try{if(a=="rm"){var t=IT.splice(+d.i,1)[0];if(t.url.indexOf("blob:")==0)URL.revokeObjectURL(t.url);drawImgs()}
else if(a=="pg"){PS.pg=Math.max(0,PS.pg+ +d.d);prods().catch(fail)}
else if(a=="pub"){var ns=d.s=="published"?"draft":"published";await write("PATCH","products?id=eq."+d.id,{status:ns});toast(ns=="published"?"Published. It is now on the website.":"Unpublished. It is hidden from the website.");prods()}
else if(a=="del"){if(!confirm('Delete "'+d.n+'" permanently? This cannot be undone.'))return;await write("DELETE","products?id=eq."+d.id);(d.img?d.img.split(","):[]).forEach(rmObj);toast("Product deleted.");prods()}
else if(a=="cdel"){if(!confirm('Delete category "'+d.n+'"? Its products will become uncategorized.'))return;await write("DELETE","product_categories?id=eq."+d.id);toast("Category deleted.");route()}
else if(a=="crn"){var n=prompt("New name for this category:",d.n);if(!n||!n.trim())return;await write("PATCH","product_categories?id=eq."+d.id,{name:n.trim()});toast("Category renamed.");route()}
else if(a=="gdel"){if(!confirm("Delete this photo permanently?"))return;await write("DELETE","gallery_images?id=eq."+d.id);rmObj(d.p);toast("Photo deleted.");gal()}}catch(x){fail(x)}});
document.addEventListener("change",async function(e){var t=e.target,d=t.dataset;
try{if(t.id=="addimg"){var bad=[];Array.prototype.forEach.call(t.files,function(f){var m=badFile(f);if(m)bad.push(m);else if(IT.length>=CFG.max)bad.push("Maximum "+CFG.max+" images.");else IT.push({file:f,url:URL.createObjectURL(f)})});t.value="";drawImgs();if(bad.length)toast(bad[0],1)}
else if(d.rp!=null){var f=t.files[0],m=f&&badFile(f);if(m){toast(m,1);t.value="";return}if(f){IT[+d.rp]={file:f,url:URL.createObjectURL(f)};drawImgs()}}
else if(d.st){await write("PATCH","enquiries?id=eq."+d.st,{status:t.value});toast("Status updated.")}
else if(d.cap){await write("PATCH","gallery_images?id=eq."+d.cap,{caption:t.value.trim()||null});toast("Caption saved.")}
else if(t.id=="gf"){var bad2=[],ok=0;for(var i=0;i<t.files.length;i++){var fl=t.files[i],mm=badFile(fl);if(mm){bad2.push(mm);continue}try{var p=await upl(fl,"gallery");await write("POST","gallery_images",{image_path:p,category:$("#gc").value});ok++}catch(x){bad2.push(fl.name+": "+x.message)}}
toast(ok+" photo(s) uploaded."+(bad2.length?" "+bad2[0]:""),bad2.length&&!ok);gal()}}catch(x){fail(x)}});
route();
</script></body></html>
